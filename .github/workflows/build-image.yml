name: Build Image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      channel:
        description: Image channel
        required: true
        type: string
    secrets:
      COSIGN_PRIVATE_KEY:
        required: true

jobs:
  build:
    name: Build and push image
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/pvermeer/redtide
      REF: ${{ inputs.ref }}
      CHANNEL: ${{ inputs.channel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set release variables
        run: |
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMMIT="$(git rev-parse HEAD)"
          RELEASE_TAG="${CHANNEL}-${BUILD_TIMESTAMP}"

          echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> "$GITHUB_ENV"
          echo "COMMIT=${COMMIT}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

          echo "Git ref:     ${REF}"
          echo "Git commit:  ${COMMIT}"
          echo "Channel:     ${CHANNEL}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Build image
        run: |
          podman build \
            -f ./Containerfile \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --label "org.opencontainers.image.created=${BUILD_TIMESTAMP}" \
            -t "${IMAGE}:${RELEASE_TAG}" \
            .

      - name: Push image
        run: |
          podman push \
            --format=oci \
            --digestfile "${RUNNER_TEMP}/digest" \
            "${IMAGE}:${RELEASE_TAG}"

          DIGEST="$(cat "${RUNNER_TEMP}/digest")"

          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"

          echo "Published digest: ${DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Log in to GHCR with Cosign
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            cosign login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          cosign sign \
            --yes \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${DIGEST}"

      - name: Verify signature
        run: |
          if cosign verify \
            --new-bundle-format=false \
            --key keys/cosign-redtide-primary.pub \
            "${IMAGE}@${DIGEST}" >/dev/null 2>&1; then

            echo "Signature verified with primary key."
            exit 0
          fi

          if cosign verify \
            --new-bundle-format=false \
            --key keys/cosign-redtide-secondary.pub \
            "${IMAGE}@${DIGEST}" >/dev/null 2>&1; then

            echo "Signature verified with secondary key."
            exit 0
          fi

          echo "ERROR: Image signature could not be verified with either RedTide key."
          exit 1

      - name: Publish channel tag
        run: |
          podman tag \
            "${IMAGE}:${RELEASE_TAG}" \
            "${IMAGE}:${CHANNEL}"

          podman push \
            --format=oci \
            "${IMAGE}:${CHANNEL}"

      - name: Create Git release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            "${RELEASE_TAG}" \
            "${COMMIT}"

          git push origin \
            "${RELEASE_TAG}"

      - name: Cleanup
        if: always()
        run: |
          podman logout ghcr.io || true
