name: Build Image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      channel:
        description: Image channel
        required: true
        type: string
    secrets:
      OSTREE_PRIVATE_KEY:
        required: true

env:
  IMAGE: ghcr.io/pvermeer/redtide
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  build:
    name: Build and push image
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set release variables
        run: |
          FEDORA_MAJOR_VERSION="$(grep -m1 '^ARG FEDORA_MAJOR_VERSION=' ./Containerfile | cut -d= -f2)"
          BUILD_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          COMMIT="$(git rev-parse HEAD)"
          RELEASE_TAG="${{ inputs.channel }}-${BUILD_TIMESTAMP}"

          echo "FEDORA_MAJOR_VERSION=${FEDORA_MAJOR_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> "$GITHUB_ENV"
          echo "COMMIT=${COMMIT}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

          echo "Fedora version: ${FEDORA_MAJOR_VERSION}"
          echo "Git ref:        ${{ inputs.ref }}"
          echo "Git commit:     ${COMMIT}"
          echo "Channel:        ${{ inputs.channel }}"
          echo "Release tag:    ${RELEASE_TAG}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Build image
        run: |
          podman build \
            -f ./Containerfile \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --label "org.opencontainers.image.created=${BUILD_TIMESTAMP}" \
            -t "${IMAGE}:build" \
            .

      - name: Rechunk and sign image
        env:
          OSTREE_PRIVATE_KEY: ${{ secrets.OSTREE_PRIVATE_KEY }}
        run: |
          GRAPH_ROOT="$(podman info --format '{{.Store.GraphRoot}}')"
          RUNROOT="$(podman info --format '{{.Store.RunRoot}}')"

          private_key="$(mktemp)"
          echo "${OSTREE_PRIVATE_KEY}" > "${private_key}"
          chmod 600 "${private_key}"
          trap 'rm -f "${private_key}"' EXIT

          cat > "${RUNNER_TEMP}/storage.conf" <<EOF
          [storage]
          driver = "overlay"
          runroot = "${RUNROOT}"
          graphroot = "${GRAPH_ROOT}"
          EOF

          podman run --rm \
            --privileged \
            --security-opt label=disable \
            -e IMAGE="${IMAGE}" \
            -e RELEASE_TAG="${RELEASE_TAG}" \
            -e CHANNEL="${{ inputs.channel }}" \
            -v "$(dirname "${GRAPH_ROOT}")/$(basename "${GRAPH_ROOT}"):${GRAPH_ROOT}" \
            -v "${RUNROOT}:${RUNROOT}" \
            -v "${RUNNER_TEMP}/storage.conf:/etc/containers/storage.conf:ro" \
            -v "${private_key}:/run/secrets/ostree-private-key:ro" \
            quay.io/fedora/fedora:"${FEDORA_MAJOR_VERSION}" \
            bash -c '
              set -euxo pipefail

              echo "root:100000:65536" > /etc/subuid
              echo "root:100000:65536" > /etc/subgid

              dnf -y install rpm-ostree skopeo

              PREVIOUS_BUILD=""
              # https://github.com/bootc-dev/bootc/issues/1885 left=right panic error
              # if skopeo inspect "docker://${IMAGE}:${CHANNEL}" >/dev/null 2>&1; then
              #   PREVIOUS_BUILD="--previous-build=docker://${IMAGE}:${CHANNEL}"
              # fi

              rpm-ostree compose build-chunked-oci \
                --bootc \
                --format-version=2 \
                --from="${IMAGE}:build" \
                --output="containers-storage:${IMAGE}:${RELEASE_TAG}" \
                --sign-commit=ed25519=/run/secrets/ostree-private-key \
                ${PREVIOUS_BUILD}
            '

      - name: Push image
        run: |
          podman push \
            --format=oci \
            --digestfile "${RUNNER_TEMP}/digest" \
            "${IMAGE}:${RELEASE_TAG}"

          DIGEST="$(cat "${RUNNER_TEMP}/digest")"

          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"

          echo "Published digest: ${DIGEST}"

      - name: Publish channel tag
        run: |
          podman tag \
            "${IMAGE}:${RELEASE_TAG}" \
            "${IMAGE}:${{ inputs.channel }}"

          podman push \
            --format=oci \
            "${IMAGE}:${{ inputs.channel }}"

          if [ "${{ inputs.channel }}" = "stable" ]; then
            podman tag \
              "${IMAGE}:${RELEASE_TAG}" \
              "${IMAGE}:latest"

            podman push \
              --format=oci \
              "${IMAGE}:latest"
          fi

      - name: Create git release tag
        run: |
          OLD_TAGS="$(
            git tag --points-at "${COMMIT}" --list "${{ inputs.channel }}-*"
          )"

          for OLD_TAG in ${OLD_TAGS}; do
            if [ "${OLD_TAG}" != "${RELEASE_TAG}" ]; then
              echo "Removing old ${{ inputs.channel }} tag: ${OLD_TAG}"

              git tag -d "${OLD_TAG}"
              git push origin --delete "refs/tags/${OLD_TAG}"
            fi
          done

          echo "Creating release tag: ${RELEASE_TAG}"
          git tag "${RELEASE_TAG}" "${COMMIT}"

          echo "Publishing release tag: ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Cleanup
        if: always()
        run: |
          podman logout ghcr.io || true
