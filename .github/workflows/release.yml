name: Release

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC. Only even weeks are release weeks.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-biweekly:
    name: Check Release Week
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check release schedule
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: proceeding."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WEEK="$(date -u +%V)"

          if (( 10#$WEEK % 2 == 0 )); then
            echo "ISO week ${WEEK}: release week."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "ISO week ${WEEK}: not a release week."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  merge-stable:
    name: Merge Beta into Stable
    needs: check-biweekly
    if: needs.check-biweekly.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      beta_commit: ${{ steps.beta.outputs.commit }}

    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Fetch branches
        run: |
          git fetch origin \
            beta \
            stable

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine beta commit
        id: beta
        run: |
          BETA_COMMIT="$(git rev-parse origin/beta)"

          echo "Beta commit: ${BETA_COMMIT}"

          echo "commit=${BETA_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Merge beta into stable
        run: |
          git checkout stable
          git reset --hard origin/stable

          git merge \
            --no-ff \
            origin/beta \
            -m "Release beta as stable"

          git push origin stable

  promote-stable:
    name: Promote Beta Image to Stable
    needs: merge-stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/pvermeer/redtide

    outputs:
      stable_release_tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Inspect current beta image
        id: beta
        run: |
          BETA_INFO="$(
            skopeo inspect \
              --format '{{json .}}' \
              "docker://${IMAGE}:beta"
          )"

          BETA_DIGEST="$(echo "${BETA_INFO}" | jq -r '.Digest')"
          BETA_CREATED="$(echo "${BETA_INFO}" | jq -r '.Created')"
          BETA_COMMIT="$(
            echo "${BETA_INFO}" |
              jq -r '.Labels["org.opencontainers.image.revision"]'
          )"

          if [ -z "${BETA_DIGEST}" ] || [ "${BETA_DIGEST}" = "null" ]; then
            echo "ERROR: Could not determine beta image digest."
            exit 1
          fi

          if [ -z "${BETA_CREATED}" ] || [ "${BETA_CREATED}" = "null" ]; then
            echo "ERROR: Could not determine beta image creation time."
            exit 1
          fi

          if [ -z "${BETA_COMMIT}" ] || [ "${BETA_COMMIT}" = "null" ]; then
            echo "ERROR: Beta image has no Git revision label."
            exit 1
          fi

          echo "Beta digest:  ${BETA_DIGEST}"
          echo "Beta created: ${BETA_CREATED}"
          echo "Beta commit:  ${BETA_COMMIT}"

          echo "digest=${BETA_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "commit=${BETA_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Set stable release variables
        id: release
        run: |
          RELEASE_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_TAG="stable-${RELEASE_TIMESTAMP}"

          echo "RELEASE_TIMESTAMP=${RELEASE_TIMESTAMP}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Promote beta to stable
        run: |
          skopeo copy \
            "docker://${IMAGE}@${{ steps.beta.outputs.digest }}" \
            "docker://${IMAGE}:stable"

      - name: Publish immutable stable image tag
        run: |
          skopeo copy \
            "docker://${IMAGE}@${{ steps.beta.outputs.digest }}" \
            "docker://${IMAGE}:${RELEASE_TAG}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Create stable Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            "${RELEASE_TAG}" \
            "${{ steps.beta.outputs.commit }}"

          git push origin \
            "${RELEASE_TAG}"

  build-beta:
    name: Build New Beta
    needs: promote-stable
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: beta
      channel: beta
    secrets: inherit
