name: Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/pvermeer/redtide

    steps:
      - name: Prep
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=release-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          podman build -f ./Containerfile \
            -t "${IMAGE}:${RELEASE_TAG}" \
            -t "${IMAGE}:${BUILD_DATE}" \
            -t "${IMAGE}:latest" \
            .

      - name: Push unsigned release image
        run: |
          podman push --format=oci "${IMAGE}:${RELEASE_TAG}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR with Cosign
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Get image digest
        run: |
          DIGEST="$(podman inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${RELEASE_TAG}" | cut -d@ -f2)"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Image digest: $DIGEST"

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Verify signature
        run: |
          cosign verify --key ./keys/cosign-redtide-primary.pub "${IMAGE}@${DIGEST}"

      - name: Publish latest tag
        run: |
          podman push --format=oci "${IMAGE}:latest"

      - name: Publish date tag
        run: |
          podman push --format=oci "${IMAGE}:${BUILD_DATE}"

      - name: Cleanup
        if: always()
        run: |
          podman logout ghcr.io
