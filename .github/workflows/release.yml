name: Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/pvermeer/redtide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release variables
        run: |
          echo "BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=release-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          podman build -f ./Containerfile \
            -t "${IMAGE}:${RELEASE_TAG}" \
            .

      - name: Push release image
        run: |
          podman push \
            --format=oci \
            --digestfile "${RUNNER_TEMP}/digest" \
            "${IMAGE}:${RELEASE_TAG}"

          DIGEST="$(cat "${RUNNER_TEMP}/digest")"
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "Published digest: ${DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Log in to GHCR with Cosign
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Verify signature
        run: |
          if cosign verify --new-bundle-format=false --key keys/cosign-redtide-primary.pub "${IMAGE}@${DIGEST}" >/dev/null 2>&1; then
            echo "Signature verified with primary key."
            exit 0
          fi
          if cosign verify --new-bundle-format=false --key keys/cosign-redtide-secondary.pub "${IMAGE}@${DIGEST}" >/dev/null 2>&1; then
            echo "Signature verified with secondary key."
            exit 0
          fi
          echo "ERROR: Image signature could not be verified with either RedTide key."
          exit 1

      - name: Publish latest tag
        run: |
          podman tag "${IMAGE}:${RELEASE_TAG}" "${IMAGE}:latest"
          podman push --format=oci "${IMAGE}:latest"

      - name: Publish date tag
        run: |
          podman tag "${IMAGE}:${RELEASE_TAG}" "${IMAGE}:${BUILD_DATE}"
          podman push --format=oci "${IMAGE}:${BUILD_DATE}"

      - name: Cleanup
        if: always()
        run: |
          podman logout ghcr.io
