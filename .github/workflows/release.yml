name: Release

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC. Only even weeks are release weeks.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pvermeer/redtide
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  check-biweekly:
    name: Check Release Week
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Check release schedule
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: proceeding."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WEEK="$(date -u +%V)"

          if (( 10#$WEEK % 2 == 0 )); then
            echo "ISO week ${WEEK}: release week."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "ISO week ${WEEK}: not a release week."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  merge-stable:
    name: Merge Beta Image Commit into Stable
    needs: check-biweekly
    if: needs.check-biweekly.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    outputs:
      beta_digest: ${{ steps.beta.outputs.digest }}
      beta_commit: ${{ steps.beta.outputs.commit }}

    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Inspect beta image
        id: beta
        run: |
          BETA_INFO="$(
            skopeo inspect \
              --format '{{json .}}' \
              "docker://${IMAGE}:beta"
          )"

          BETA_DIGEST="$(echo "${BETA_INFO}" | jq -r '.Digest')"
          BETA_COMMIT="$(
            echo "${BETA_INFO}" |
              jq -r '.Labels["org.opencontainers.image.revision"]'
          )"

          if [ -z "${BETA_DIGEST}" ] || [ "${BETA_DIGEST}" = "null" ]; then
            echo "ERROR: Could not determine beta image digest."
            exit 1
          fi

          if [ -z "${BETA_COMMIT}" ] || [ "${BETA_COMMIT}" = "null" ]; then
            echo "ERROR: Beta image has no Git revision label."
            exit 1
          fi

          echo "Beta digest: ${BETA_DIGEST}"
          echo "Beta commit: ${BETA_COMMIT}"

          echo "digest=${BETA_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "commit=${BETA_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Merge beta image commit into stable
        run: |
          git merge \
            --no-ff \
            "${{ steps.beta.outputs.commit }}" \
            -m "Release beta as stable"

          git push origin stable

  promote-stable:
    name: Promote Beta Image to Stable
    needs: merge-stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Set stable release tag
        run: |
          echo "RELEASE_TAG=stable-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            skopeo login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Promote beta to stable
        run: |
          skopeo copy \
            "docker://${IMAGE}@${{ needs.merge-stable.outputs.beta_digest }}" \
            "docker://${IMAGE}:stable"

          skopeo copy \
            "docker://${IMAGE}@${{ needs.merge-stable.outputs.beta_digest }}" \
            "docker://${IMAGE}:latest"

      - name: Publish stable image tag
        run: |
          skopeo copy \
            "docker://${IMAGE}@${{ needs.merge-stable.outputs.beta_digest }}" \
            "docker://${IMAGE}:${RELEASE_TAG}"

      - name: Create stable Git tag
        run: |
          OLD_TAGS="$(
            git tag --points-at "${{ needs.merge-stable.outputs.beta_commit }}" --list "stable-*"
          )"

          for OLD_TAG in ${OLD_TAGS}; do
            if [ "${OLD_TAG}" != "${RELEASE_TAG}" ]; then
              echo "Removing old stable tag: ${OLD_TAG}"

              git tag -d "${OLD_TAG}"
              git push origin --delete "refs/tags/${OLD_TAG}"
            fi
          done

          echo "Creating release tag: ${RELEASE_TAG}"
          git tag "${RELEASE_TAG}" "${{ needs.merge-stable.outputs.beta_commit }}"

          echo "Publishing release tag: ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

  build-beta:
    name: Build New Beta
    needs: promote-stable
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: beta
      channel: beta
    secrets: inherit
