- repo: fedora
  install:
    - gamescope
    - gamemode
    - mangohud

- repo: terra
  repo_file: terra.repo
  install:
    - gamescope-session-steam
  kmods:
    - akmod: xone
      package: akmod-xone

- repo: rpmfusion-nonfree-steam
  repo_file: rpmfusion-nonfree-steam.repo
