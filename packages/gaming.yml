- repo:
    - rpmfusion-free
    - rpmfusion-free-updates
    - rpmfusion-nonfree
    - rpmfusion-nonfree-updates
  repo_file:
    - rpmfusion-free.repo
    - rpmfusion-nonfree.repo
  install:
    - steam
    - steam-devices

- repo: fedora
  install:
    - gamescope
    - gamemode
    - mangohud

- repo: terra
  repo_file: terra.repo
  kmods:
    - akmod: xonedo
      package: akmod-xonedo
    - akmod: xpadneo
      package: akmod-xpadneo

- repo: local
  install:
    - steamos

- repo: copr:copr.fedorainfracloud.org:pvermeer:sunshine
  repo_file: pvermeer-sunshine.repo
  install:
    - sunshine

- repo: copr:copr.fedorainfracloud.org:pvermeer:virtual-display
  repo_file: pvermeer-virtual-display.repo
  install:
    - virtual-display
