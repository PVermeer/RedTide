- repo: fedora
  install:
    - gnome-tweaks
    - adw-gtk3-theme
  dconf:
    - schema: org/gnome/desktop/interface
      keys:
        - key: gtk-theme
          value: adw-gtk3

        - key: gtk-enable-primary-paste
          value: true

    - schema: org/gnome/desktop/wm/preferences
      keys:
        - key: button-layout
          value: appmenu:minimize,maximize,close

  extensions:
    - id: appindicatorsupport@rgcjonas.gmail.com
      package: gnome-shell-extension-appindicator
      enable: true

- repo: local
  extensions:
    - id: caffeine@patapon.info
      package: gnome-shell-extension-caffeine
      enable: true
      dconf:
        - schema: org/gnome/shell/extensions/caffeine
          keys:
            - key: enable-mpris
              value: true

            - key: show-notifications
              value: false

    - id: blur-my-shell@aunetx
      package: gnome-shell-extension-blur-my-shell
      enable: true
      dconf:
        - schema: org/gnome/shell/extensions/blur-my-shell/panel
          keys:
            - key: override-background-dynamically
              value: true

        - schema: org/gnome/shell/extensions/blur-my-shell/overview
          keys:
            - key: style-components
              value: 3

        - schema: org/gnome/shell/extensions/blur-my-shell/dash-to-dock
          keys:
            - key: style-dash-to-dock
              value: 0

        - schema: org/gnome/shell/extensions/blur-my-shell/popup
          keys:
            - key: blur
              value: false

    - id: just-perfection-desktop@just-perfection
      package: gnome-shell-extension-just-perfection
      enable: true
      dconf:
        - schema: org/gnome/shell/extensions/just-perfection
          keys:
            - key: animation
              value: 5

    - id: hotedge@jonathan.jdoda.ca
      package: gnome-shell-extension-hotedge
      enable: true
      dconf:
        - schema: org/gnome/shell/extensions/hotedge
          keys:
            - key: show-animation
              value: false

            - key: suppress-activation-when-fullscreen
              value: false

    - id: wireless-hid@chlumskyvaclav.gmail.com
      package: gnome-shell-extension-wireless-hid
      enable: true
