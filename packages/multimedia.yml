# https://github.com/rpmfusion/rpmfusion-nonfree-release/blob/master/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020

- repo: fedora
  install:
    - libva-utils
    - vulkan-tools

- repo:
    - rpmfusion-free
    - rpmfusion-free-updates
    - rpmfusion-nonfree
    - rpmfusion-nonfree-updates
  repo_file:
    - rpmfusion-free.repo
    - rpmfusion-nonfree.repo
  install:
    - intel-media-driver
    - mesa-va-drivers-freeworld
    - libva-nvidia-driver
    - gstreamer1-plugin-libav
    - gstreamer1-plugins-bad-free-extras
    - gstreamer1-plugins-bad-freeworld
    - gstreamer1-plugins-ugly

- repo:
    - rpmfusion-free
    - rpmfusion-free-updates
    - rpmfusion-nonfree
    - rpmfusion-nonfree-updates
  repo_file:
    - rpmfusion-free.repo
    - rpmfusion-nonfree.repo
  remove:
    - fdk-aac-free
    - libavcodec-free
    - libavdevice-free
    - libavfilter-free
    - libavformat-free
    - libavutil-free
    - libswresample-free
    - libswscale-free
    - ffmpeg-free
  install:
    - ffmpeg

- repo:
    - rpmfusion-free
    - rpmfusion-free-updates
    - rpmfusion-nonfree
    - rpmfusion-nonfree-updates
  repo_file:
    - rpmfusion-free.repo
    - rpmfusion-nonfree.repo
  install:
    - mesa-vulkan-drivers-freeworld
  remove:
    - mesa-vulkan-drivers

# 32 bit for steam
- repo:
    - rpmfusion-free
    - rpmfusion-free-updates
    - rpmfusion-nonfree
    - rpmfusion-nonfree-updates
  repo_file:
    - rpmfusion-free.repo
    - rpmfusion-nonfree.repo
  install:
    - mesa-vulkan-drivers-freeworld.i686
