page_type: settings
title: Settings
icon: preferences-system-symbolic
groups:
  - title: Gnome extra settings
    settings:
      - type: switch
        title: Disable logout prompt
        subtitle: Set Gnome to not show a prompt on logout / restart / shutdown
        actions:
          - action: dconf
            type: set
            schema: org.gnome.SessionManager
            key: logout-prompt
            value: "false"
